<!DOCTYPE html>
<!--
  Screenshot harness — not part of the build (vite only processes index.html),
  not deployed. Loads the app with seeded sample data and no Supabase, so
  design work can be rendered headlessly at phone size.
  Run: python3 -m http.server 4499 --directory app  →  /_shots.html
-->
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>shots</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body><div id="app"></div>
<script>
(function(){function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function wkOf(date){var d=new Date(date);d.setHours(0,0,0,0);var day=d.getDay();var m=new Date(d);m.setDate(d.getDate()-(day===0?6:day-1));return iso(m);}
var today=new Date(),wk=wkOf(today),mon=new Date(wk+'T00:00:00');
function dayOf(i){var d=new Date(mon);d.setDate(mon.getDate()+i);return iso(d);}
function job(id,name,mins){return {id:id,name:name,creditMins:mins,variableInput:null,ts:Date.now()};}
var days={};
days[dayOf(0)]=[job('asv_chb_cir_wh_swh','Gas Service',40),job('gas_repair','Gas Repair',56),job('hi_lead','HI Lead',58)];
days[dayOf(1)]=[job('gas_repair','Gas Repair',56),job('asv_fre','Gas Service (Gas Fire)',47)];
var tk=iso(today);
days[tk]=(days[tk]||[]).concat([job('gas_repair','Gas Repair',56),job('asv_chb_cir_wh_swh','Gas Service',40),job('fv_chb','First Visit',48)]);
var weeks={};weeks[wk]={deductionMins:30,deductionLog:[],shifts:{},mentorDays:{},excludeFromCtap:false,notes:'',days:days};
localStorage.setItem('jct_state',JSON.stringify({baseHours:40,weeklyTargetPct:0.8,startingBalance:6.4,weeks:weeks}));
localStorage.setItem('jcpd_theme','dark');})();
</script>
<script src="pixel-engineer.js"></script><script src="data.cjs"></script><script src="app.js"></script></body></html>
