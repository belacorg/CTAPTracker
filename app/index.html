<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CTAP">
  <title>CTAP Tracker</title>
  <link rel="manifest" href="manifest.json">
  <!-- iOS ignores the manifest's icons and, with no apple-touch-icon, builds the
       home-screen icon from a screenshot of the page. -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <!--
    Fonts are served from this origin, not fonts.googleapis.com. An app that
    tells the engineer nothing leaves their device cannot open by announcing
    itself to a third party, and a webfont that only arrives online is the wrong
    kind of dependency for work done in cellars and plant rooms. See ADR-0016.
  -->
  <link rel="preload" href="fonts/DMSans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css?v=175">
  <link rel="stylesheet" href="style.css?v=175">
  <script>if(localStorage.getItem('jcpd_theme')==='light')document.documentElement.style.background='#f2f2f7';</script>
</head>
<body>
  <div id="app"></div>
  <!--
    Local-only build. The cloud layer (src/main.js, src/db.js, src/auth.js) is
    intact but deliberately not loaded — see ADR-0015. Everything the engineer
    enters stays in localStorage on this device and no account exists to sync it
    to. Restoring sync is this script tag plus the flag below, nothing more:
    every __ctapSync* call site in app.js is already guarded on the bridge
    existing, so with main.js absent they are all no-ops.
  -->
  <script>window.__ctapSupabaseActive = false;</script>
  <script src="data.cjs?v=175"></script>
  <script src="pixel-engineer.js?v=175"></script>
  <script src="app.js?v=175"></script>
</body>
</html>
