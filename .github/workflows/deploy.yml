name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # No Supabase credentials: the app is local-only (ADR-0015) and index.html
      # does not load src/main.js, so nothing in the built bundle reads them.
      # They are omitted rather than left dead — a deploy config carrying a
      # database URL is the first thing that contradicts "nothing leaves the
      # device", whether or not the code uses it. Restore them alongside the
      # module script tag if sync is ever switched back on.
      - name: Build
        run: npm run build

      - name: Copy static assets to dist
        run: |
          cp app/app.js app/data.cjs app/sw.js app/manifest.json app/pixel-engineer.js dist/
          cp -r app/icons dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dist folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
