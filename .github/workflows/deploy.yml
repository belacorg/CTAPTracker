name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to match the version the suite is developed against. jsdom 30
      # bundles undici 8, which calls webidl.util.markAsUncloneable — absent on
      # Node 20, where every jsdom suite then fails to load rather than fails a
      # test. Ten of fifteen files went down that way the first time the deploy
      # ran the tests.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # No Supabase credentials: the app is local-only (ADR-0015) and index.html
      # does not load src/main.js, so nothing in the built bundle reads them.
      # They are omitted rather than left dead — a deploy config carrying a
      # database URL is the first thing that contradicts "nothing leaves the
      # device", whether or not the code uses it. Restore them alongside the
      # module script tag if sync is ever switched back on.

      # build.mjs copies app/ to dist/ verbatim — no bundler, so what the trial
      # engineers load is byte-identical to what runs in dev and under test.
      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dist folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
